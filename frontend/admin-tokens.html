<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Token Purchases | Maharaja Builders</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/admin-dashboard.css" />
  <link rel="stylesheet" href="css/notify.css" />
  <style>
    /* Additional Admin Token Styles */
    .admin-container {
      display: flex;
      min-height: 100vh;
    }

    .main-content {
      flex: 1;
      padding: 30px;
      background: #f8f9fa;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .page-header h1 {
      font-size: 2rem;
      color: var(--primary-green);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .stat-card h3 {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .stat-card .number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-green);
    }

    .filter-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .filter-tab {
      padding: 8px 20px;
      border-radius: 30px;
      background: #f1f3f4;
      color: #5f6368;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .filter-tab.active {
      background: var(--primary-green);
      color: white;
    }

    .purchases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 25px;
    }

    .purchase-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
    }

    .purchase-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(11,61,46,0.15);
    }

    .purchase-header {
      padding: 20px;
      background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
      color: white;
    }

    .purchase-id {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    .purchase-user {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .purchase-content {
      padding: 20px;
    }

    .purchase-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
    }

    .detail-item {
      text-align: center;
    }

    .detail-label {
      font-size: 0.75rem;
      color: var(--text-light);
      display: block;
    }

    .detail-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-green);
    }

    .receipt-section {
      margin: 15px 0;
      text-align: center;
    }

    .view-receipt-btn {
      background: none;
      border: 2px solid var(--primary-green);
      color: var(--primary-green);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }

    .view-receipt-btn:hover {
      background: var(--primary-green);
      color: white;
    }

    .purchase-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-approve,
    .btn-reject {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-approve {
      background: #34a853;
      color: white;
    }

    .btn-approve:hover {
      background: #2d8e47;
    }

    .btn-reject {
      background: #ea4335;
      color: white;
    }

    .btn-reject:hover {
      background: #c5221f;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .status-approved {
      background: #d4edda;
      color: #155724;
    }

    .status-rejected {
      background: #f8d7da;
      color: #721c24;
    }

    .no-purchases {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px;
      background: white;
      border-radius: 15px;
      color: var(--text-light);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-light);
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 20px;
      }
      
      .purchases-grid {
        grid-template-columns: 1fr;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="header-container">
        <div class="sidebar-header">
          <a href="index.html" title="Back to Home"><img src="img/maharaja.png" alt="Logo" class="logo" /></a>
        </div>
      </div>
      <h2 class="admin-heading">Maharaja Admin</h2>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="admin-dashboard.html"> Dashboard</a>
        <a href="admin-listings.html"> Listings</a>
        <a href="admin-users.html"> Users</a>
        <a href="admin-tokens.html" class="active"> Token Purchases</a>
        <a href="admin-ads.html"> Advertisements</a>
        <a href="index.html"> Back to Home</a>
        <button type="button" class="logout-btn" id="admin-logout-btn"> Logout</button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1>Token Purchase Requests</h1>
      </div>

      <!-- Stats Cards -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <h3>Total Requests</h3>
          <div class="number" id="totalRequests">0</div>
        </div>
        <div class="stat-card">
          <h3>Pending</h3>
          <div class="number" id="pendingRequests">0</div>
        </div>
        <div class="stat-card">
          <h3>Total Tokens Sold</h3>
          <div class="number" id="totalTokens">0</div>
        </div>
        <div class="stat-card">
          <h3>Total Revenue</h3>
          <div class="number" id="totalRevenue">PKR 0</div>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <span class="filter-tab active" data-filter="all">All</span>
        <span class="filter-tab" data-filter="pending">Pending</span>
        <span class="filter-tab" data-filter="approved">Approved</span>
        <span class="filter-tab" data-filter="rejected">Rejected</span>
      </div>

      <!-- Purchases Grid -->
      <div class="purchases-grid" id="purchasesGrid">
        <div class="loading">Loading token purchases...</div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/load-components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/admin-tokens.js"></script>
  <script>
    function toggleSidebar() {
      const nav = document.querySelector('.sidebar-nav');
      if (nav) nav.classList.toggle('collapsed');
    }
  </script>
</body>
</html>
