<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Maharaja Builders</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/maharaja.png">
  <link rel="stylesheet" href="css/signup.css">
  <link rel="stylesheet" href="css/notify.css">
</head>
<body>
  <div class="signup-container">
    <div class="signup-card">
      <div class="logo">
        <img src="img/maharaja.png" alt="Maharaja Builders Logo">
      </div>
      <h2>Reset Password</h2>
      <p>Enter your new password</p>
      <div id="message" class="form-message" style="display: none;"></div>
      <form id="reset-password-form">
        <input type="password" name="new_password" placeholder="New Password" required>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        <button type="submit">Reset Password</button>
      </form>
      <p class="login-link"><a href="login.html">← Back to Login</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
