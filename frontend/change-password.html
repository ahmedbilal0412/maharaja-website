<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Maharaja Builders</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/maharaja.png">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/add-property.css">
  <link rel="stylesheet" href="css/notify.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="logo-container">
        <div class="logo">
          <a href="index.html"><img src="img/maharaja.png" alt="Logo"></a>
        </div>
      </div>
      <button class="mobile-menu-toggle" onclick="toggleSidebar()">☰</button>
      <nav id="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="my-listings.html">My Listings</a>
        <a href="add-property.html">Add Property</a>
        <a href="change-password.html" class="active">Change Password</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <h1>Change Password</h1>
      </header>

      <section class="add-property-section">
        <form id="change-password-form">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="current-password" placeholder="Enter current password" required>
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="new-password" placeholder="Enter new password (min 6 characters)" required>
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm new password" required>
          </div>
          <button type="submit" class="submit-btn">Change Password</button>
        </form>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/change-password.js"></script>
  <script>
    function toggleSidebar() {
      const nav = document.getElementById("navbar");
      if (nav) nav.classList.toggle("collapsed");
    }
  </script>
</body>
</html>
