<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Properties for sale in Pakistan - Maharaja Builders & Realtors</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/properties.css" />
</head>
<body>
  <div data-include="components/navbar.html"></div>

  <!-- Page Header -->
  <section class="page-header">
    <div class="header-container">
      <h1>Properties for Sale</h1>
      <p>Explore our collection of premium real estate</p>
    </div>
  </section>

  <!-- Main Content -->
  <section class="properties-section">
    <div class="container">
      <!-- Top Bar with Tabs and Controls -->
      <div class="properties-top-bar">
        <p id="properties-count-header">0 properties found</p>
        <div class="view-controls">
          <div class="sort-dropdown">
            <select id="sort-properties">
              <option value="featured">Sort by: Featured</option>
              <option value="newest">Newest First</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
            </select>
          </div>
          <div class="view-toggle">
            <button class="view-btn grid-view active" id="grid-view-btn" title="Grid view">
              <i class="fas fa-th-large"></i>
            </button>
            <button class="view-btn column-view" id="column-view-btn" title="Column view">
              <i class="fas fa-list"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Filter and Results Grid -->
      <div class="properties-layout">
        <!-- Filter Sidebar -->
        <aside class="filter-sidebar">
          <div class="filter-header">
            <h3><i class="fas fa-sliders-h"></i> Filter</h3>
            <button class="reset-link" id="reset-filters">X</button>
          </div>

          <!-- Location Search -->
          <div class="filter-section">
            <h4>Selected Location</h4>
            <div class="location-search">
              <i class="fas fa-search location-search-icon"></i>
              <input type="text" id="search-input" placeholder="Search for location">
            </div>
          </div>

          <!-- Property Type Filter -->
          <div class="filter-section">
            <h4>Property type</h4>
            <div class="filter-options">
              <label class="filter-option">
                <input type="checkbox" value="house" class="listing-filter"> Houses <span class="count"></span>
              </label>
              <label class="filter-option">
                <input type="checkbox" value="apartment" class="listing-filter"> Apartments <span class="count"></span>
              </label>
              <label class="filter-option">
                <input type="checkbox" value="villa" class="listing-filter"> Villas <span class="count"></span>
              </label>
              <label class="filter-option">
                <input type="checkbox" value="commercial" class="listing-filter"> Commercial <span class="count"></span>
              </label>
              <label class="filter-option">
                <input type="checkbox" value="plot" class="listing-filter"> Plot <span class="count"></span>
              </label>
            </div>
          </div>

          <!-- Buy/Rent Filter -->
          <div class="filter-section">
            <h4>Listing Type</h4>
            <div class="listing-type-options">
              <label class="filter-option radio-option">
                <input type="radio" name="listing-type" value="sale" checked> For Sale
              </label>
              <label class="filter-option radio-option">
                <input type="radio" name="listing-type" value="rent"> For Rent
              </label>
            </div>
          </div>

          <!-- Price Range (hidden by default, shown when needed) -->
          <div class="filter-section">
            <h4>Price Range</h4>
            <select id="price-filter" class="price-select">
              <option value="">Any Price</option>
              <option value="0-10000000">Under PKR 1 Crore</option>
              <option value="10000000-25000000">PKR 1-2.5 Crore</option>
              <option value="25000000-50000000">PKR 2.5-5 Crore</option>
              <option value="50000000-100000000">PKR 5-10 Crore</option>
              <option value="100000000+">Over PKR 10 Crore</option>
            </select>
          </div>

          <!-- Beds & Baths (simplified) -->
          <div class="filter-section">
            <h4>Beds & Baths</h4>
            <div class="beds-baths">
              <select class="beds-select">
                <option>Any beds</option>
                <option>1+ beds</option>
                <option>2+ beds</option>
                <option>3+ beds</option>
                <option>4+ beds</option>
              </select>
              <select class="baths-select">
                <option>Any baths</option>
                <option>1+ baths</option>
                <option>2+ baths</option>
                <option>3+ baths</option>
                <option>4+ baths</option>
              </select>
            </div>
          </div>
        </aside>
        <!-- Property Grid -->
        <div class="properties-grid-container">
          <div id="properties-grid" class="properties-grid">
          </div>
        </div>
      </div>
    </div>
  </section>

  <div data-include="components/footer.html"></div>

  <script src="js/config.js"></script>
  <script src="js/load-components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/home.js"></script>
  <script src="js/properties.js"></script>
</body>
</html>
